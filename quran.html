<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коран | Ummah Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Amiri:wght@700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #3d3129;
            --accent-gold: #c2a378;
            --white: #ffffff;
            --bg-page: #fdfaf5;
            --text-muted: #8c8279;
            --transition: 0.3s ease;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at top right, rgba(176,141,87,0.05), transparent);
            background-attachment: fixed;
            margin: 0; padding: 20px;
            color: var(--bg-dark);
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .back-btn {
            background: linear-gradient(135deg, var(--bg-dark), #4a3429);
            color: white;
            border: 1px solid var(--accent-gold);
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 25px;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
        }
        .back-btn:hover { transform: translateX(-5px); }

        .search-container { margin-bottom: 40px; }
        #surahSearch {
            width: 100%;
            padding: 18px 25px;
            border-radius: 15px;
            border: 1px solid rgba(176,141,87,0.3);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            font-size: 1rem;
            font-family: 'Montserrat';
            outline: none;
            transition: var(--transition);
            text-align: center;
        }
        #surahSearch:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(194,163,120,0.15); }

        .quran-header { text-align: center; margin-bottom: 50px; }
        .arabic-title {
            font-family: 'Amiri', serif;
            font-size: clamp(3rem, 8vw, 4.5rem);
            color: var(--accent-gold);
            display: block;
            margin-bottom: 10px;
        }
        h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .surah-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }
        .surah-card:hover {
            transform: translateY(-8px);
            background: var(--white);
            box-shadow: 0 20px 40px rgba(176,141,87,0.15);
            border-color: var(--accent-gold);
        }

        .surah-num {
            position: absolute;
            top: -15px; right: 20px;
            background: var(--bg-dark);
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 0.9rem; font-weight: 700; color: var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .ar-name { font-family: 'Scheherazade New', serif; font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; }
        .ru-name { font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; text-align: center; color: var(--bg-dark); }
        .ru-desc { font-size: 0.9rem; opacity: 0.6; font-style: italic; }

        #reading-view { display: none; }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            text-align: center;
            margin: 40px 0;
            color: var(--bg-dark);
        }

        .ayah-box {
            background: var(--white);
            padding: 35px 40px;
            border-radius: 20px;
            margin-bottom: 25px;
            border-right: 5px solid var(--accent-gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .ayah-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ayah-num {
            color: var(--accent-gold);
            font-weight: 700;
            padding: 5px 15px;
            background: #fdf8f0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .play-btn {
            background: var(--accent-gold);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(176,141,87,0.3);
        }
        .play-btn:hover { background: var(--bg-dark); transform: scale(1.1); }
        .play-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .ayah-text-ar {
            font-family: 'Scheherazade New', serif;
            font-size: 2.8rem;
            text-align: right;
            display: block;
            line-height: 2.4;
            margin-bottom: 25px;
            direction: rtl;
        }

        .ayah-text-ru {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.8;
            margin: 0 0 22px 0;
        }

        /* ─── КНОПКА ТАФСИРА ─── */
        .tafsir-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1.5px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 9px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .tafsir-toggle-btn:hover {
            background: rgba(194,163,120,0.1);
        }
        .tafsir-toggle-btn.open {
            background: var(--accent-gold);
            color: white;
        }
        .tafsir-toggle-btn .arrow {
            transition: transform 0.3s ease;
            font-size: 0.7rem;
            display: inline-block;
        }
        .tafsir-toggle-btn.open .arrow {
            transform: rotate(180deg);
        }

        /* ─── БЛОК ТАФСИРА ─── */
        .tafsir-block {
            display: none;
            margin-top: 22px;
            padding: 28px 30px;
            background: linear-gradient(135deg, #fdf8f0, #faf3e8);
            border-radius: 14px;
            border-left: 4px solid var(--accent-gold);
        }
        .tafsir-block.visible {
            display: block;
            animation: tafsirReveal 0.35s ease forwards;
        }

        .tafsir-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tafsir-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(194,163,120,0.35);
        }

        .tafsir-content {
            font-size: 1rem;
            line-height: 2;
            color: #3a3028;
        }
        .tafsir-content p { margin: 0 0 14px 0; }
        .tafsir-content p:last-child { margin-bottom: 0; }

        /* Арабский текст внутри тафсира */
        .tafsir-content span[class*="arabic"],
        .tafsir-content .arabic {
            font-family: 'Scheherazade New', serif;
            font-size: 1.4rem;
            direction: rtl;
            unicode-bidi: embed;
            color: var(--bg-dark);
        }

        .tafsir-no-data {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        @keyframes tafsirReveal {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer { text-align: center; padding: 60px 0; opacity: 0.5; font-size: 0.9rem; }

        @media (max-width: 600px) {
            .surah-grid { grid-template-columns: 1fr; }
            .ayah-text-ar { font-size: 2.2rem; }
            .ayah-box { padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="back-btn" onclick="handleBack()">← Назад</button>

    <!-- СПИСОК СУР -->
    <div id="list-view">
        <div class="quran-header">
            <span class="arabic-title">القرآن الكريم</span>
            <h1>Священный Коран</h1>
        </div>
        <div class="search-container">
            <input type="text" id="surahSearch" placeholder="Поиск суры...">
        </div>
        <div class="surah-grid" id="surah-container"></div>
    </div>

    <!-- ЧТЕНИЕ СУРЫ -->
    <div id="reading-view">
        <div class="quran-header">
            <span id="current-ar" class="arabic-title"></span>
            <h1 id="current-ru"></h1>
            <p id="current-info" style="opacity:0.6;margin-top:8px;"></p>
        </div>
        <div id="ayahs-container"></div>
    </div>

    <footer>&copy; 2026 Ummah Online.</footer>
</div>

<script>
    const namesRu = ["Аль-Фатиха — Открывающая — 🕋","Аль-Бакара — Корова — 🕌","Аль Имран — Семейство Имрана — 🕌","Ан-Ниса — Женщины — 🕌","Аль-Маида — Трапеза — 🕌","Аль-Ан'ам — Скот — 🕋","Аль-А'раф — Преграды — 🕋","Аль-Анфаль — Добыча — 🕌","Ат-Тауба — Покаяние — 🕌","Юнус — Иона — 🕋","Худ — Худ — 🕋","Юсуф — Иосиф — 🕋","Ар-Ра'д — Гром — 🕋","Ибрахим — Авраам — 🕋","Аль-Хиджр — Хиджр — 🕋","Ан-Нахль — Пчёлы — 🕋","Аль-Исра — Ночной перенос — 🕋","Аль-Кахф — Пещера — 🕋","Марьям — Мария — 🕋","Та Ха — Та Ха — 🕋","Аль-Анбия — Пророки — 🕋","Аль-Хадж — Паломничество — 🕌","Аль-Му'минун — Верующие — 🕋","Ан-Нур — Свет — 🕌","Аль-Фуркан — Различение — 🕋","Аш-Шу'ара — Поэты — 🕋","Ан-Намль — Муравьи — 🕋","Аль-Касас — Рассказ — 🕋","Аль-'Анкабут — Паук — 🕋","Ар-Рум — Римляне — 🕋","Лукман — Лукман — 🕋","Ас-Саджда — Поклон — 🕋","Аль-Ахзаб — Союзники — 🕌","Саба — Сава — 🕋","Фатыр — Творец — 🕋","Йа Син — Йа Син — 🕋","Ас-Саффат — Выстроившиеся в ряд — 🕋","Сад — Сад — 🕋","Аз-Зумар — Толпы — 🕋","Гафир — Прощающий — 🕋","Фуссилят — Разъяснённые — 🕋","Аш-Шура — Совет — 🕋","Аз-Зухруф — Украшения — 🕋","Ад-Духан — Дым — 🕋","Аль-Джасия — Коленопреклонённые — 🕋","Аль-Ахкаф — Песчаные холмы — 🕋","Мухаммад — Мухаммад — 🕌","Аль-Фатх — Победа — 🕌","Аль-Худжурат — Комнаты — 🕌","Каф — Каф — 🕋","Аз-Зарият — Развевающие — 🕋","Ат-Тур — Гора — 🕋","Ан-Наджм — Звезда — 🕋","Аль-Камар — Луна — 🕋","Ар-Рахман — Милостивый — 🕋","Аль-Ваки'а — Событие — 🕋","Аль-Хадид — Железо — 🕌","Аль-Муджадила — Препирающаяся — 🕌","Аль-Хашр — Собрание — 🕌","Аль-Мумтахина — Испытуемая — 🕌","Ас-Сафф — Ряды — 🕌","Аль-Джуму'а — Пятница — 🕌","Аль-Мунафикун — Лицемеры — 🕌","Ат-Тагабун — Взаимный убыток — 🕌","Ат-Талак — Развод — 🕌","Ат-Тахрим — Запрещение — 🕌","Аль-Мульк — Власть — 🕋","Аль-Калам — Перо — 🕋","Аль-Хакка — Неминуемое — 🕋","Аль-Ма'аридж — Ступени — 🕋","Нух — Ной — 🕋","Аль-Джинн — Джинны — 🕋","Аль-Муззаммиль — Закутавшийся — 🕋","Аль-Муддассир — Завернувшийся — 🕋","Аль-Кияма — Воскресение — 🕋","Аль-Инсан — Человек — 🕋","Аль-Мурсалят — Посылаемые — 🕋","Ан-Наба — Весть — 🕋","Ан-Нази'ат — Вырывающие — 🕋","'Абаса — Нахмурился — 🕋","Ат-Таквир — Скручивание — 🕋","Аль-Инфитар — Раскалывание — 🕋","Аль-Мутаффифин — Обвешивающие — 🕋","Аль-Иншикак — Разверзание — 🕋","Аль-Бурудж — Созвездия — 🕋","Ат-Тарик — Ночной путник — 🕋","Аль-А'ля — Всевышний — 🕋","Аль-Гашия — Покрывающее — 🕋","Аль-Фаджр — Заря — 🕋","Аль-Балад — Город — 🕋","Аш-Шамс — Солнце — 🕋","Аль-Лейль — Ночь — 🕋","Ад-Духа — Утро — 🕋","Аш-Шарх — Раскрытие — 🕋","Ат-Тин — Смоковница — 🕋","Аль-'Аляк — Сгусток — 🕋","Аль-Кадр — Предопределение — 🕋","Аль-Баййина — Ясное знамение — 🕌","Аз-Зальзаля — Сотрясение — 🕌","Аль-'Адият — Мчащиеся — 🕋","Аль-Кари'а — Поражающее — 🕋","Ат-Такасур — Страсть к умножению — 🕋","Аль-'Аср — Время — 🕋","Аль-Хумаза — Хулитель — 🕋","Аль-Филь — Слон — 🕋","Курайш — Курайшиты — 🕋","Аль-Ма'ун — Мелочь — 🕋","Аль-Каусар — Изобилие — 🕋","Аль-Кафирун — Неверующие — 🕋","Ан-Наср — Помощь — 🕌","Аль-Масад — Пальмовое волокно — 🕋","Аль-Ихляс — Искренность — 🕋","Аль-Фаляк — Рассвет — 🕋","Ан-Нас — Люди — 🕋"];

    let qData = [];
    let tafsirData = {};
    let isReading = false;
    let currentAudio = null;

    async function loadAll() {
        try {
            const [qRes, tRes] = await Promise.all([
                fetch('quran_ru.json'),
                fetch('tafsir_ru.json')
            ]);
            qData = (await qRes.json());
            qData = qData.suras || qData;
            tafsirData = await tRes.json();
        } catch (e) {
            console.error('Ошибка загрузки:', e);
        }
        renderList();
    }

    // Получить тафсир по номеру суры и аята (1-based)
    function getTafsir(surahNum, ayahNum) {
        const key = `${surahNum}:${ayahNum}`;
        const entry = tafsirData[key];
        if (!entry) return null;
        return (typeof entry === 'object' && entry.text !== undefined) ? entry.text : String(entry);
    }

    function renderList() {
        const container = document.getElementById('surah-container');
        container.innerHTML = '';
        qData.forEach((surah, i) => {
            const parts = namesRu[i].split(' — ');
            const card = document.createElement('div');
            card.className = 'surah-card';
            card.style.animationDelay = `${i * 0.01}s`;
            card.onclick = () => openSurah(i);
            card.innerHTML = `
                <div class="surah-num">${i + 1}</div>
                <span class="ar-name">${surah.name}</span>
                <div class="ru-name">${parts[0]} ${parts[2] || ''}</div>
                <div class="ru-desc">${parts[1]}</div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('surahSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.surah-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
        });
    });

    function getAudioPath(surahNum, ayahNum) {
        const s = String(surahNum).padStart(3, '0');
        const a = String(ayahNum).padStart(3, '0');
        return `full quran/${s}${a}.mp3`;
    }

    function toggleAudio(btn, surahIdx, ayahIdx) {
        const path = getAudioPath(surahIdx + 1, ayahIdx + 1);
        if (currentAudio && currentAudio._path === path) {
            if (currentAudio.paused) {
                currentAudio.play();
                btn.innerHTML = pauseIcon();
            } else {
                currentAudio.pause();
                btn.innerHTML = playIcon();
            }
            return;
        }
        if (currentAudio) {
            currentAudio.pause();
            document.querySelectorAll('.play-btn').forEach(b => b.innerHTML = playIcon());
        }
        currentAudio = new Audio(path);
        currentAudio._path = path;
        btn.innerHTML = pauseIcon();
        currentAudio.play().catch(() => { btn.innerHTML = playIcon(); });
        currentAudio.onended = () => { btn.innerHTML = playIcon(); };
    }

    const playIcon  = () => `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    const pauseIcon = () => `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

    function toggleTafsir(btn, blockId) {
        const block = document.getElementById(blockId);
        const isOpen = block.classList.contains('visible');
        block.classList.toggle('visible', !isOpen);
        btn.classList.toggle('open', !isOpen);
        btn.querySelector('.label-text').textContent = isOpen ? 'Читать тафсир' : 'Скрыть тафсир';
    }

    function openSurah(index) {
        isReading = true;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('reading-view').style.display = 'block';

        const surah = qData[index];
        const parts = namesRu[index].split(' — ');
        document.getElementById('current-ar').innerText = surah.name;
        document.getElementById('current-ru').innerText = parts[0];

        const ayahs = surah.aya || surah.verses;
        document.getElementById('current-info').innerText = `${parts[1]} · ${ayahs.length} аятов`;

        const container = document.getElementById('ayahs-container');
        container.innerHTML = '';

        // Басмала (кроме сур 1 и 9)
        if (index !== 0 && index !== 8) {
            container.innerHTML += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
        }

        const surahNum = index + 1;

        ayahs.forEach((ayah, i) => {
            const ayahNum = i + 1;
            const blockId = `tf-${surahNum}-${ayahNum}`;
            const tafsirHtml = getTafsir(surahNum, ayahNum);

            const tafsirInner = tafsirHtml
                ? `<div class="tafsir-content">${tafsirHtml}</div>`
                : `<p class="tafsir-no-data">Тафсир для этого аята не найден.</p>`;

            const div = document.createElement('div');
            div.className = 'ayah-box';
            div.innerHTML = `
                <div class="ayah-header">
                    <span class="ayah-num">Аят ${ayahNum}</span>
                    <button class="play-btn" onclick="toggleAudio(this,${index},${i})">${playIcon()}</button>
                </div>
                <span class="ayah-text-ar">${ayah.text}</span>
                <p class="ayah-text-ru">${ayah.translation || ayah.text_russian || ''}</p>
                <button class="tafsir-toggle-btn" onclick="toggleTafsir(this,'${blockId}')">
                    <span>📖</span>
                    <span class="label-text">Читать тафсир</span>
                    <span class="arrow">▼</span>
                </button>
                <div id="${blockId}" class="tafsir-block">
                    <div class="tafsir-label">Тафсир ибн Касир</div>
                    ${tafsirInner}
                </div>
            `;
            container.appendChild(div);
        });

        window.scrollTo(0, 0);
    }

    function handleBack() {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        if (isReading) {
            isReading = false;
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('reading-view').style.display = 'none';
            window.scrollTo(0, 0);
        } else {
            window.location.href = 'index.html';
        }
    }

    loadAll();
</script>
</body>
</html>
